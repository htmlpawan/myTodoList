<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>

    <title>My List</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- Modern web font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />

    <style>
      .list-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 15, 25, 0.55);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: stretch;
        justify-content: center;
        z-index: 9999;
      }
      .list-modal-overlay.hidden {
        display: none;
      }
      .list-modal {
        background: #ffffff;
        width: 100%;
        max-width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .list-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid #eef0f4;
        background: #4f46e5;
        color: #fff;
      }
      .list-modal-header h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
      .list-modal-close {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        color: #fff;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .list-modal-close:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      .list-modal-body {
        flex: 1;
        overflow-y: auto;
        padding: 0;
      }
      .list-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .list-table thead th {
        position: sticky;
        top: 0;
        background: #f7f7fb;
        text-align: left;
        padding: 12px 16px;
        font-weight: 600;
        color: #55586b;
        border-bottom: 1px solid #eef0f4;
      }
      .list-table thead th:first-child {
        width: 156px;
        /* text-align: center; */
      }
      .list-table tbody td {
        padding: 12px 16px;
        border-bottom: 1px solid #f1f2f6;
        vertical-align: middle;
      }
      .list-table tbody td:first-child {
        width: 156px;
      }
      .restore-cell {
        width: 100px;
        display: flex;
        gap: 20px;
        align-items: center;
      }
      .restore-btn{
         filter: invert(53%) sepia(93%) saturate(451%) hue-rotate(127deg) brightness(89%) contrast(91%);
      }
      .list-table tbody tr:hover {
        background: #fafaff;
      }
      .list-status-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }
      .list-status-badge.completed {
        background: #e6f7ef;
        color: #12875a;
      }
      .list-status-badge.pending {
        background: #fff4e5;
        color: #b5730a;
      }
      .list-modal-empty {
        padding: 40px 20px;
        text-align: center;
        color: #9296a8;
      }
      .header-title-wrapper {
        cursor: pointer;
      }

      .task-date {
          position: absolute;
          font-size: 6px;
          bottom: 2px;
          left: 50%;
          transform: translateX(-50%);
      }
    </style>

  </head>
  <body>
    <main class="app-wrapper">
      <div class="todo-card" id="todo-card">
        <!-- Header -->
        <header class="app-header">
          <img src="reload.png" alt="App Logo" class="app-logo" style="width: 42px;position: absolute;top: -25px;right: -16px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    border-radius: 50%;" onclick="location.reload()" />
          <div class="header-title-wrapper" id="list-title-trigger" title="Click to view full list">
            <div class="header-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 11l3 3L22 4"></path>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
              </svg>
            </div>
            <h3>My List Item</h3>
          </div>

           <!-- Stats Bar -->
        <section class="stats-bar hidden" aria-label="Task statistics">
          <div class="stat-item">
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat-divider" aria-hidden="true"></div>
          <div class="stat-item text-amber">
            <span class="stat-value" id="stat-pending">0</span>
            <span class="stat-label">Pending</span>
          </div>
          <div class="stat-divider" aria-hidden="true"></div>
          <div class="stat-item text-emerald">
            <span class="stat-value" id="stat-completed">0</span>
            <span class="stat-label">Completed</span>
          </div>
        </section>

        <!-- Input Form Section -->
        <section style="width: 100%;" class="input-section">
          <form id="todo-form" class="todo-form" autocomplete="off">
            <div class="input-wrapper">
              <input 
                type="text" 
                id="task-input" 
                class="task-input" 
                placeholder="Please enter a item..." 
                aria-label="Add a new task"
                maxlength="200"
                required 
              />
              <button type="submit" class="btn btn-primary" id="add-btn">
                <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add Item</span>
              </button>
            </div>
            <!-- <span class="input-hint">Press <kbd>Enter</kbd> to add task</span> -->
          </form>
        </section>

        <!-- Controls Section: Search & Filters -->
        <section style="width: 100%;" class="controls-section">
          <!-- Search Box -->
          <div class="search-box hidden">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="text" 
              id="search-input" 
              class="search-input" 
              placeholder="Search tasks..." 
              aria-label="Search tasks"
            />
            <button type="button" id="clear-search-btn" class="clear-search-btn hidden" aria-label="Clear search">
              &times;
            </button>
          </div>

          <!-- Filter Buttons -->
          <nav class="filter-group" aria-label="Filter tasks">
            <button type="button" class="filter-btn" data-filter="all">
              All <span class="filter-count" id="count-all">0</span>
            </button>
            <button type="button" class="filter-btn active" data-filter="active">
              Active <span class="filter-count" id="count-active">0</span>
            </button>
            <button type="button" class="filter-btn" data-filter="completed">
              Completed <span class="filter-count" id="count-completed">0</span>
            </button>
          </nav>
        </section>
        </header>

       

        <!-- Task List Container -->
        <section class="task-list-section">
          <ul id="task-list" class="task-list" aria-label="List of tasks"></ul>

          <!-- Empty State (Shown dynamically) -->
          <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon-wrapper">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
            </div>
            <h3 id="empty-title" class="empty-title">No tasks found</h3>
            <p id="empty-subtitle" class="empty-subtitle">You are all caught up! Add a new task above to get started.</p>
          </div>
        </section>

        <!-- Footer Actions -->
        <footer class="app-footer hidden">
          <span class="footer-tip">Tip: Double-click task text or click Edit to modify</span>
          <button type="button" id="clear-completed-btn" class="clear-completed-btn hidden">
            Clear Completed
          </button>
        </footer>
      </div>
    </main>
    
    <!-- Full-page List Modal (table view) -->
    <div class="list-modal-overlay hidden" id="list-modal-overlay">
      <div class="list-modal" role="dialog" aria-modal="true" aria-labelledby="list-modal-title">
        <div class="list-modal-header">
          <h2 id="list-modal-title">My List Item Deleted</h2>
          <button type="button" class="list-modal-close" id="list-modal-close" aria-label="Close">&times;</button>
        </div>
        <div class="list-modal-body">
          <table class="list-table">
            <thead>
              <tr>
                <!-- <th>No.</th> -->
                <th>Item</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="list-modal-tbody">
              <!-- rows injected by script.js -->
            </tbody>
          </table>
          <div id="list-modal-empty" class="list-modal-empty hidden">No items yet.</div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./script.js" defer></script>
  </body>
</html>
